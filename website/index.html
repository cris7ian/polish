<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4f1">
  <meta name="description" content="Polish is a little writing app for macOS.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://polish.salsaparapizza.com/">
  <link rel="stylesheet" href="styles.css">
  <script defer src="water.js"></script>
  <title>Polish — not the country</title>
</head>
<body>
  <header class="header shell">
    <a class="brand" href="/" aria-label="Polish home"><img src="icon.svg" width="38" height="38" alt=""><span>Polish</span></a>
    <a class="github" href="https://github.com/cris7ian/polish">GitHub <span aria-hidden="true">↗</span></a>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="title">
      <div class="intro">
        <p class="eyebrow">A little writing app for Mac</p>
        <h1 id="title">Your words,<br><em>well put.</em></h1>
        <p class="description">An app, not the Country.</p>
        <a class="download" href="https://github.com/cris7ian/polish/releases">Get Polish <span aria-hidden="true">↗</span></a>
        <p class="requirements">macOS · OpenAI API key required</p>
      </div>
      <div class="art" aria-hidden="true">
        <div class="water">
          <svg class="wave wave-back" viewBox="0 0 1440 400" preserveAspectRatio="none"><path d="M0 104 C180 42 245 174 420 118 S686 61 840 126 S1100 171 1260 108 S1370 77 1440 104 V400 H0Z"/></svg>
          <svg class="wave wave-front" viewBox="0 0 1440 400" preserveAspectRatio="none"><path d="M0 131 C130 190 276 55 430 122 S675 183 840 118 S1070 60 1230 133 S1370 174 1440 131 V400 H0Z"/></svg>
        </div>
        <div class="app-window">
          <img src="polish-app.png" alt="">
          <div class="demo-text"><span class="demo-before"><i style="--i:0">M</i><i style="--i:1">e</i><i style="--i:2">e</i><i style="--i:3">s</i><i style="--i:4">a</i><i style="--i:5">&nbsp;</i><i style="--i:6">h</i><i style="--i:7">a</i><i style="--i:8">s</i><i style="--i:9">&nbsp;</i><i style="--i:10">a</i><i style="--i:11">&nbsp;</i><i style="--i:12">b</i><i style="--i:13">r</i><i style="--i:14">i</i><i style="--i:15">l</i><i style="--i:16">-</i><i style="--i:17">l</i><i style="--i:18">i</i><i style="--i:19">a</i><i style="--i:20">n</i><i style="--i:21">t</i><i style="--i:22">&nbsp;</i><i style="--i:23">i</i><i style="--i:24">d</i><i style="--i:25">e</i><i style="--i:26">a</i><i style="--i:27">!</i></span><span class="demo-after">Meesa has a brilliant idea!</span><span class="demo-context">It’s gonna be bombad.</span></div>
          <span class="demo-press"></span>
        </div>
      </div>
    </section>
  </main>
  <footer class="shell footer"><span>Polish <span>·</span> not the country</span><a href="https://cristiancaroli.com/">Cristian Caroli ↗</a></footer>

</html>
